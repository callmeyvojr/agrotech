</head>

<body>
    <header>
        <div class="marque">
            <img src="image/gak.png" alt="Logo GAK AGROTECH" height="80" width="80">
            <p class="nom-entreprise">GAK-AGROTECH</p>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="apropos.html">À propos</a>
            <a href="services.html">Nos services</a>

        </nav>
        <a class="bouton" href="https://wa.me/2250718767611" target="_blank" rel="noopener noreferrer">CONTACTEZ-NOUS</a>
    </header>

    <main>
        <h1>INSCRIPTION</h1>
        <section id="inscription">
            <form class="inscription" action="" method="post">
                <p class="intro">Remplissez les champs ci-dessous pour vous inscrire et recevoir plus d'informations :</p>
                <div class="champs">
                    <label for="nom">Nom :</label>
                    <input id="nom" name="nom" type="text" placeholder="Kouassi Fabrice Joe" autocomplete="name"
                        minlength="4" required>
                </div>
                <div class="champs">
                    <label for="email">Email :</label>
                    <input id="email" name="email" type="email" placeholder="fabricejoe@gmail.com" autocomplete="email"
                        required>
                </div>
                <div class="champs">
                    <label for="tel">Numéro de téléphone :</label>
                    <input id="tel" name="tel" type="tel" placeholder="0123456789" autocomplete="tel" required>
                </div>
                <div class="champs">
                    <label for="message">Entrez votre message :</label>
                    <textarea id="message" name="message" placeholder="Votre message..." rows="5"></textarea>
                </div>
                <button type="submit">Valider</button>
            </form>
        </section>
    </main>

    <footer>
